<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4d7c0f" />
    </marker>
  </defs>

  <rect x="20" y="20" width="560" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="20" width="560" height="6" rx="3" fill="#65a30d"/>

  <text x="40" y="55" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Derivation Sequence for "aabb"</text>
  <text x="40" y="73" font-family="monospace" font-size="11" fill="#4d7c0f">Grammar: S -> a S b | ε</text>

  <!-- Step 0 -->
  <rect x="40" y="95" width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="55" y="121" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b">Step 0:</text>
  <text x="120" y="122" font-family="monospace" font-size="15" font-weight="800" fill="#0f172a">S</text>
  <text x="190" y="121" font-family="Inter, sans-serif" font-size="9.5" fill="#4d7c0f">Start symbol</text>

  <!-- Arrow 0 -> 1 -->
  <path d="M 150 137 L 150 155" fill="none" stroke="#4d7c0f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="150" font-family="monospace" font-size="9" font-weight="600" fill="#4d7c0f">S -> a S b</text>

  <!-- Step 1 -->
  <rect x="40" y="160" width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="55" y="186" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b">Step 1:</text>
  <text x="120" y="187" font-family="monospace" font-size="15" font-weight="800" fill="#0f172a">a <tspan fill="#4d7c0f">S</tspan> b</text>
  <text x="190" y="186" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b">Sentential form</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 150 202 L 150 220" fill="none" stroke="#4d7c0f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="215" font-family="monospace" font-size="9" font-weight="600" fill="#4d7c0f">S -> a S b</text>

  <!-- Step 2 -->
  <rect x="40" y="225" width="220" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="55" y="251" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#64748b">Step 2:</text>
  <text x="110" y="252" font-family="monospace" font-size="15" font-weight="800" fill="#0f172a">a a <tspan fill="#4d7c0f">S</tspan> b b</text>
  <text x="190" y="251" font-family="Inter, sans-serif" font-size="9.5" fill="#64748b">Nested wrap</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 150 267 L 150 285" fill="none" stroke="#4d7c0f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="175" y="280" font-family="monospace" font-size="9" font-weight="600" fill="#4d7c0f">S -> ε</text>

  <!-- Step 3 (Sentence) -->
  <rect x="40" y="290" width="220" height="45" rx="6" fill="#f7fee7" stroke="#4d7c0f" stroke-width="2"/>
  <text x="55" y="318" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#365314">Step 3:</text>
  <text x="115" y="319" font-family="monospace" font-size="16" font-weight="800" fill="#365314">a a b b</text>
  <text x="185" y="317" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#15803d">Final Sentence ✓</text>

  <!-- Right Side: Parse Tree representation -->
  <rect x="290" y="80" width="270" height="250" rx="8" fill="#fcfdf7" stroke="#e2e8f0" stroke-width="1"/>
  <text x="425" y="105" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Equivalent Parse Tree</text>

  <!-- Root S -->
  <circle cx="425" cy="135" r="13" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="425" y="139" font-family="monospace" font-size="12" font-weight="700" fill="#365314" text-anchor="middle">S</text>

  <!-- Level 1: a, S, b -->
  <line x1="415" y1="145" x2="350" y2="180" stroke="#64748b" stroke-width="1.2"/>
  <line x1="425" y1="148" x2="425" y2="180" stroke="#4d7c0f" stroke-width="1.2"/>
  <line x1="435" y1="145" x2="500" y2="180" stroke="#64748b" stroke-width="1.2"/>

  <rect x="338" y="180" width="24" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="350" y="195" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">a</text>

  <circle cx="425" cy="192" r="12" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="425" y="196" font-family="monospace" font-size="11" font-weight="700" fill="#365314" text-anchor="middle">S</text>

  <rect x="488" y="180" width="24" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="500" y="195" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">b</text>

  <!-- Level 2: a, S, b -->
  <line x1="417" y1="202" x2="385" y2="230" stroke="#64748b" stroke-width="1.2"/>
  <line x1="425" y1="204" x2="425" y2="230" stroke="#4d7c0f" stroke-width="1.2"/>
  <line x1="433" y1="202" x2="465" y2="230" stroke="#64748b" stroke-width="1.2"/>

  <rect x="373" y="230" width="24" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="385" y="245" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">a</text>

  <circle cx="425" cy="241" r="11" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="425" y="245" font-family="monospace" font-size="10" font-weight="700" fill="#365314" text-anchor="middle">S</text>

  <rect x="453" y="230" width="24" height="22" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="465" y="245" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">b</text>

  <!-- Level 3: epsilon -->
  <line x1="425" y1="252" x2="425" y2="280" stroke="#4d7c0f" stroke-width="1.2"/>
  <rect x="413" y="280" width="24" height="22" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="425" y="295" font-family="monospace" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle">ε</text>

  <!-- Yield banner -->
  <rect x="330" y="310" width="190" height="15" rx="3" fill="#ecfccb"/>
  <text x="425" y="321" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" fill="#365314" text-anchor="middle">Yield: a · a · ε · b · b = "aabb"</text>
</svg>
