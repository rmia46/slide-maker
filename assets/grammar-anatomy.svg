<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4d7c0f" />
    </marker>
  </defs>

  <rect x="20" y="20" width="560" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="20" width="560" height="6" rx="3" fill="#65a30d"/>

  <!-- Formula Header -->
  <rect x="180" y="38" width="240" height="42" rx="8" fill="#f7fee7" stroke="#bef264" stroke-width="1.5"/>
  <text x="300" y="65" font-family="monospace" font-size="16" font-weight="800" fill="#365314" text-anchor="middle">G = ( V, T, P, S )</text>

  <!-- 4 Component Cards -->
  <!-- V: Non-terminals -->
  <rect x="40" y="105" width="240" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="105" width="240" height="5" rx="2" fill="#4d7c0f"/>
  <circle cx="65" cy="135" r="14" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="65" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#365314" text-anchor="middle">V</text>
  <text x="90" y="132" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Non-Terminals</text>
  <text x="90" y="148" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Internal variables / categories</text>
  <rect x="55" y="165" width="210" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="182" font-family="monospace" font-size="10.5" font-weight="600" fill="#4d7c0f" text-anchor="middle">{ Expr, Stmt, Term, Factor }</text>

  <!-- T: Terminals -->
  <rect x="320" y="105" width="240" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="320" y="105" width="240" height="5" rx="2" fill="#1e40af"/>
  <rect x="52" y="121" width="26" height="26" rx="4" transform="translate(290,0)" fill="#eff6ff" stroke="#1e40af" stroke-width="2"/>
  <text x="355" y="139" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">T</text>
  <text x="380" y="132" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Terminals</text>
  <text x="380" y="148" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Leaf symbols / literal tokens</text>
  <rect x="335" y="165" width="210" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="182" font-family="monospace" font-size="10.5" font-weight="600" fill="#1e40af" text-anchor="middle">{ +, *, (, ), 'if', num, id }</text>

  <!-- P: Productions -->
  <rect x="40" y="225" width="240" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="225" width="240" height="5" rx="2" fill="#d97706"/>
  <circle cx="65" cy="255" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="65" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">P</text>
  <text x="90" y="252" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Production Rules</text>
  <text x="90" y="268" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Rewrite rules A -> alpha</text>
  <rect x="55" y="285" width="210" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="302" font-family="monospace" font-size="10.5" font-weight="600" fill="#d97706" text-anchor="middle">Expr -> Expr + Term | Term</text>

  <!-- S: Start Symbol -->
  <rect x="320" y="225" width="240" height="105" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="320" y="225" width="240" height="5" rx="2" fill="#059669"/>
  <circle cx="345" cy="255" r="14" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="345" y="260" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">S</text>
  <text x="370" y="252" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Start Symbol</text>
  <text x="370" y="268" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Root of every derivation (S in V)</text>
  <rect x="335" y="285" width="210" height="26" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="302" font-family="monospace" font-size="10.5" font-weight="600" fill="#059669" text-anchor="middle">S = &lt;Program&gt; or &lt;Expr&gt;</text>
</svg>
