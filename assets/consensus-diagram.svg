<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- Client Box -->
  <rect x="30" y="140" width="120" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="140" width="120" height="6" rx="3" fill="#64748b"/>
  <text x="90" y="180" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>
  <text x="90" y="200" font-family="Inter, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Proposal: v = 42</text>

  <!-- Arrow: Client -> Leader -->
  <path d="M 150 185 L 225 185" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="187" y="175" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#2563eb" text-anchor="middle">write(v)</text>

  <!-- Leader Box -->
  <rect x="235" y="130" width="130" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="235" y="130" width="130" height="6" rx="3" fill="#2563eb"/>
  <text x="300" y="165" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Raft Leader</text>
  <text x="300" y="185" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#3b82f6" text-anchor="middle">Term 12</text>
  <rect x="250" y="200" width="100" height="22" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="300" y="215" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#1e40af" text-anchor="middle">Log Index: 104</text>

  <!-- Follower 1 Box -->
  <rect x="440" y="40" width="130" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="440" y="40" width="130" height="6" rx="3" fill="#10b981"/>
  <text x="505" y="80" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Follower A</text>
  <text x="505" y="100" font-family="Inter, sans-serif" font-size="10" fill="#059669" text-anchor="middle">✓ Replicated</text>

  <!-- Follower 2 Box -->
  <rect x="440" y="150" width="130" height="90" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="440" y="150" width="130" height="6" rx="3" fill="#10b981"/>
  <text x="505" y="190" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Follower B</text>
  <text x="505" y="210" font-family="Inter, sans-serif" font-size="10" fill="#059669" text-anchor="middle">✓ Replicated</text>

  <!-- Follower 3 Box (Partitioned) -->
  <rect x="440" y="260" width="130" height="90" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#shadow)" stroke-dasharray="4 3"/>
  <rect x="440" y="260" width="130" height="6" rx="3" fill="#ef4444"/>
  <text x="505" y="300" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">Follower C</text>
  <text x="505" y="320" font-family="Inter, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle">✗ Partitioned</text>

  <!-- Replication Arrows -->
  <path d="M 365 160 Q 400 110 435 85" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 365 185 L 435 185" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <path d="M 365 210 Q 400 260 435 295" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Quorum badge -->
  <rect x="235" y="280" width="130" height="30" rx="15" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="300" y="299" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#166534" text-anchor="middle">Quorum: 2/3 Nodes ✓</text>
</svg>
