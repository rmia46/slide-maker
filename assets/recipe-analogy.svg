<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4d7c0f" />
    </marker>
  </defs>

  <!-- Container Box -->
  <rect x="20" y="20" width="560" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="20" width="560" height="6" rx="3" fill="#65a30d"/>

  <!-- Start Symbol: The Finished Dish -->
  <rect x="210" y="45" width="180" height="50" rx="8" fill="#f7fee7" stroke="#4d7c0f" stroke-width="2"/>
  <text x="300" y="68" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#365314" text-anchor="middle">Start Symbol S</text>
  <text x="300" y="85" font-family="Inter, sans-serif" font-size="10.5" fill="#4d7c0f" text-anchor="middle">The Finished Dish: &lt;Program&gt;</text>

  <!-- Arrows to Sub-dishes -->
  <path d="M 270 95 L 170 140" fill="none" stroke="#4d7c0f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 330 95 L 430 140" fill="none" stroke="#4d7c0f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Non-Terminals: Intermediate Prep -->
  <rect x="80" y="145" width="180" height="60" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="170" y="170" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Non-Terminal (Prep)</text>
  <text x="170" y="190" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">&lt;StmtList&gt; -> &lt;Stmt&gt; ...</text>

  <rect x="340" y="145" width="180" height="60" rx="8" fill="#ecfccb" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="430" y="170" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Non-Terminal (Prep)</text>
  <text x="430" y="190" font-family="monospace" font-size="10" fill="#0f172a" text-anchor="middle">&lt;Expr&gt; -> &lt;Term&gt; ...</text>

  <!-- Production Rules in between -->
  <rect x="230" y="215" width="140" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="235" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">P: Recipe Steps (Rules)</text>

  <!-- Arrows to Ingredients -->
  <path d="M 140 205 L 100 260" fill="none" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 200 205 L 230 260" fill="none" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 205 L 370 260" fill="none" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 460 205 L 500 260" fill="none" stroke="#4d7c0f" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Terminals: Raw Ingredients (Atomic Tokens) -->
  <rect x="50" y="265" width="90" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="95" y="286" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Terminal (Leaf)</text>
  <text x="95" y="303" font-family="monospace" font-size="10" font-weight="700" fill="#4d7c0f" text-anchor="middle">'print'</text>

  <rect x="180" y="265" width="90" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="225" y="286" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Terminal (Leaf)</text>
  <text x="225" y="303" font-family="monospace" font-size="10" font-weight="700" fill="#4d7c0f" text-anchor="middle">'id'</text>

  <rect x="330" y="265" width="90" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="375" y="286" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Terminal (Leaf)</text>
  <text x="375" y="303" font-family="monospace" font-size="10" font-weight="700" fill="#4d7c0f" text-anchor="middle">'+' / '*'</text>

  <rect x="460" y="265" width="90" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="505" y="286" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Terminal (Leaf)</text>
  <text x="505" y="303" font-family="monospace" font-size="10" font-weight="700" fill="#4d7c0f" text-anchor="middle">'42'</text>
</svg>
