<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d" />
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1e40af" />
    </marker>
  </defs>

  <rect x="20" y="20" width="560" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="20" width="560" height="6" rx="3" fill="#65a30d"/>

  <text x="300" y="48" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="middle">Top-Down (LL) vs Bottom-Up (LR) Parsing Strategies</text>

  <!-- Left: Top-Down -->
  <rect x="40" y="65" width="245" height="265" rx="8" fill="#f7fee7" stroke="#bef264" stroke-width="1.5"/>
  <rect x="40" y="65" width="245" height="26" rx="4" fill="#ecfccb"/>
  <text x="162" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#365314" text-anchor="middle">Top-Down Parsing (LL)</text>

  <!-- Root S at top -->
  <rect x="122" y="105" width="80" height="26" rx="4" fill="#ffffff" stroke="#4d7c0f" stroke-width="1.5"/>
  <text x="162" y="122" font-family="monospace" font-size="11" font-weight="700" fill="#365314" text-anchor="middle">Start: S</text>

  <!-- Downward arrows -->
  <path d="M 162 135 L 162 185" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-down)"/>
  <text x="195" y="162" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#15803d">Expand</text>

  <!-- Leaves at bottom -->
  <rect x="70" y="195" width="185" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="162" y="214" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Leaves: id + id * id</text>

  <rect x="55" y="240" width="215" height="75" rx="4" fill="#ffffff" stroke="#bef264" stroke-width="1"/>
  <text x="65" y="258" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#365314">• Direction: Root → Leaves</text>
  <text x="65" y="275" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Method: Recursive Descent</text>
  <text x="65" y="292" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Predicts production rule in advance</text>
  <text x="65" y="307" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Requires no left recursion</text>

  <!-- Right: Bottom-Up -->
  <rect x="315" y="65" width="245" height="265" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="315" y="65" width="245" height="26" rx="4" fill="#dbeafe"/>
  <text x="437" y="82" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#1e40af" text-anchor="middle">Bottom-Up Parsing (LR)</text>

  <!-- Root S at top -->
  <rect x="397" y="105" width="80" height="26" rx="4" fill="#ffffff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="437" y="122" font-family="monospace" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Goal: S</text>

  <!-- Upward arrows -->
  <path d="M 437 185 L 437 135" fill="none" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrow-up)"/>
  <text x="472" y="162" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1e40af">Reduce</text>

  <!-- Leaves at bottom -->
  <rect x="345" y="195" width="185" height="30" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="437" y="214" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Tokens: id + id * id</text>

  <rect x="330" y="240" width="215" height="75" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
  <text x="340" y="258" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="#1e40af">• Direction: Leaves → Root</text>
  <text x="340" y="275" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Method: Shift-Reduce (Bison)</text>
  <text x="340" y="292" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Replaces RHS handles with LHS</text>
  <text x="340" y="307" font-family="Inter, sans-serif" font-size="9" fill="#64748b">• Handles direct left recursion</text>
</svg>
